# ABV-IIITM Non-Teaching Recruitment Portal — production stack.
#
#   cp .env.example .env            # then edit (see docs/DEPLOYMENT.md, "Docker")
#   ./scripts/deploy.sh             # build, back up, migrate, start, verify
#
# One immutable image runs the app, the queue worker and the scheduler. Configuration
# comes only from ./.env (mounted read-only); documents, logs and backups live on volumes.

name: ntrec

x-app: &app
  image: abviiitm/ntrec-app:${IMAGE_TAG:-latest}
  restart: unless-stopped
  volumes:
    - ${APP_ENV_FILE:-./.env}:/var/www/html/.env:ro
    - storage:/var/www/html/storage
    - backups:/var/backups/ntrec
  networks: [internal]
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: app

  # Referee invitations and every other email are delivered from here.
  queue:
    <<: *app
    command: php artisan queue:work --queue=mail,default --tries=5 --sleep=3 --max-time=3600
    stop_grace_period: 120s

  # Reminders, backups, retention review, closing advertisements (routes/console.php).
  scheduler:
    <<: *app
    command: php artisan schedule:work

  web:
    image: abviiitm/ntrec-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: web
    restart: unless-stopped
    command: sh -c "ln -sf /etc/nginx/ntrec/${NGINX_SITE:-https}.conf /etc/nginx/conf.d/site.conf && exec nginx -g 'daemon off;'"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./docker/prod/certs}:/etc/nginx/certs:ro
    depends_on: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-ntrec}
      MYSQL_USER: ${DB_USERNAME:-ntrec}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/prod/mysql/my.cnf:/etc/mysql/conf.d/ntrec.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  # Optional upload virus scanning: `--profile clamav`, then CLAMAV_HOST=clamav in .env.
  clamav:
    image: clamav/clamav:1.4
    profiles: [clamav]
    restart: unless-stopped
    networks: [internal]

  # Staging only: catches all mail. `--profile staging`, MAIL_HOST=mailpit, MAIL_PORT=1025.
  mailpit:
    image: axllent/mailpit:latest
    profiles: [staging]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks: [internal]

volumes:
  storage:
  backups:
  mysql-data:
  redis-data:

networks:
  internal:
    driver: bridge
