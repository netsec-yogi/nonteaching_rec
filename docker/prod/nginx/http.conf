# Plain HTTP: use only when TLS is terminated by an institute reverse proxy / load balancer
# in front of this host. Set TRUSTED_PROXIES and FORCE_HTTPS=true in .env.
map $http_x_forwarded_proto $ntrec_https { https on; default ""; }

server {
    listen 80;
    server_name _;
    include /etc/nginx/ntrec/common.inc;
}
